<!DOCTYPE html>

<body>

    <div th:replace="~{inc/header.html :: header}"></div>
    
    <h2>Join</h2>
    <p>추가 정보를 입력합니다.</p>

    <table class="vertical content">
        <tr>

            <th>이메일</th>

    </table>
    <div>
        <button>가입하기</button>
    </div>
    </form>
    
</body>
