<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

    <div class="message" th:fragment="tel">연락처: 010-1234-5678</div>

    <h1 th:fragment="title(main,sub)">

        <th:block>게시판</th:block>

    </h1>
</body>
</html>
