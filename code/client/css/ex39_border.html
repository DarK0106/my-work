<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테두리</title>
    <style>
        /* 
            border-radius: 모서리를 둥글게
            - 최대값: 이미지의 짧은 축 길이의 1/2 까지
            - 절대값으로 줄때는 각 모서리에 원 그려서 모서리를 깎음
            - 상대값으로 줄때는 중앙에 원 그려서 모서리를 깎음
        
        
        */
        #img1 {
            border-radius: 94px;
        }

        #img2 {
            border-radius: 50%;
        }

        #list input {
            display: block;
            margin-bottom: 5px;
            border: 1px solid #767676;
            padding: 3px;
            outline: none;
            border-radius: 3px;
        }

        .input {
            /* 1. 플로트(float)로 깨진 뼈대를 깔끔하게 감싸주는 블록 설정 */
            display: inline-block;

            /* 2. 세련됨의 핵심: 은은한 3D 그림자 장착 */
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.08);
            border-radius: 5px;

            /* 3. 마우스를 올렸을 때 뚝뚝 끊기지 않고 부드럽게 움직이도록 세팅 */
            transition: all 0.3s ease;

            /* 아래 요소들과 겹치지 않게 여백 추가 */
            margin-bottom: 15px;
        }

        /* 4. 마우스가 올라갔을 때(Hover)의 타격감 추가! */
        .input:hover {
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.15);
            /* 그림자가 넓고 진해짐 */
            transform: translateY(-2px);
            /* 화면 앞으로 살짝 떠오름 */
        }

        /* 검색창 내부의 진짜 input 창을 클릭했을 때의 타격감 */
        .input>input[type=text]:focus {
            /* 기존의 밋밋한 회색 선을 지우고 */
            border-color: cornflowerblue;

            /* 파란색 은은한 후광(그림자)을 뿜어냅니다 */
            box-shadow: 0 0 0 3px rgba(100, 149, 237, 0.3);

            /* 색상이 변할 때 부드럽게 스르륵 바뀌도록 */
            transition: all 0.3s ease;
        }

        .input>i {
            border: 1px solid #555;
            padding: 3px 5px;
            background-color: #ededed;
            /* border-radius: 5px; */
            border-top-left-radius: 5px;
            border-bottom-left-radius: 5px;
            float: left;
        }

        .input>input[type=text] {
            border: 1px solid #555;
            outline: none;
            float: left;
            padding: 3.4px;
            border-left-width: 0px;
            border-top-right-radius: 5px;
            border-bottom-right-radius: 5px;

        }

        .input::after {
            content: '';
            display: block;
            clear: both;
        }

        .input.red>i {
            background-color: tomato;
        }

        .input.yellow>i {
            background-color: goldenrod;
        }

        .input.blue>i {
            background-color: cornflowerblue;
        }
    </style>
    <script src="https://kit.fontawesome.com/02b63299de.js" crossorigin="anonymous"></script>

</head>

<body>
    <!-- ex39_border.html  -->
    <h1>테두리</h1>
    <div>
        <img src="images/dog01.jpg" id="img1">
    </div>
    <div>
        <img src="images/dog01.jpg" id="img2">
    </div>

    <hr>

    <div id="list">
        <input type="text">
        <input type="text">
        <input type="text">
        <input type="text">
    </div>

    <hr>

    <i class="fa-brands fa-accessible-icon" style="font-size: 2em; color: crimson;"></i>
    <i class="fa-brands fa-accessible-icon" style="font-size: 2em; color: green;"></i>
    <i class="fa-brands fa-accessible-icon" style="font-size: 2em; color: blue;"></i>
    <span style="font-size: 2em; color: hotpink;">♿♿♿</span>

    <hr>

    <div>
        검색:
        <input type="text">


    </div>

    <hr>

    <div class="input red">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text">


    </div>
    <hr>

    <div class="input yellow">
        <i class="fa-solid fa-floppy-disk"></i>
        <input type="text">


    </div>
    <hr>

    <div class="input blue">
        <i class="fa-solid fa-trash-can"></i>
        <input type="text">


    </div>
    <hr>
</body>

</html>
