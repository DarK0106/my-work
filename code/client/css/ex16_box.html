<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            박스 모델
            1. 테두리, border
            2. 너비, 높이, width, height


            *블럭 태그와 인라인 태그의 너비/높이 정책

            - 블럭 태그 정책
            1. 기본 정책
                a. 너비: 100%(부모 영역을 꽉 채운다.)
                b. 높이: 내용물의 높이가 영역의 높이가 된다.

            2. 명시적으로 지정
                a. 너비: 지정한 수치
                b. 높이: 지정한 수치

            - 인라인 태그 정책
            1. 기본 정책
                a. 너비: 내용물의 너비가 영역의 너비가 된다.
                a. 높이: 내용물의 높이가 영역의 높이가 된다.
            
            2. 명시적 지정
                a. 너비: 명시적으로 지정 불가
                b. 높이: 명시적으로 지정 불가
                예외: 폼태그, 이미지는 지정 가능
        
        
        */

        #div2
        {
            background-color: gold;
            /* width: 200px;
            height: 200px; */

            /* 기본값 */
            width: 100%;
            height: auto;

        }

        #span2
        {
            background-color: violet;
            display: inline-block;
            /* 한줄로 쭉 이어지는 애들이 인라인 태그인데 */
            /* 고정 크기를 갖게 되면 인라인 태그의 원래 목적을 */
            /* 표현하는데 많은 문제가 생겨서 */
            /* 인라인 태그들은 사이즈를 못 건드리게 하자! 라는게 결론 */
            width: 200px;
            height: 200px;

        }


    </style>
</head>
<body>
    <!-- ex16_box.html -->
    <h1>박스 모델</h1>
    <!-- div#div$.box{상자$}*3 -->
    <div id="div1" class="box">상자1</div>
    <div id="div2" class="box">상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2상자2</div>
    <div id="div3" class="box">상자3</div>
    <hr>

    <!-- span#span${영역$}*3 -->
    <span id="span1">영역1</span>
    <span id="span2">영역2</span>
    <span id="span3">영역3</span>

    <hr>

    a<input type="text" id="txt1" style="width: 50px;">a
    
    <hr>
    
    b<img src="images/catty01.png" id="img1" style="width: 50px;">b
</body>
</html>
