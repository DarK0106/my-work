    <link rel="stylesheet" href="normalize.css">
    <style>
        /* 
            User Agent Style Sheet
            - 개발자 편하라고 브라우저가 미리 적용한 서식
            - 브라우저 종류마다 User Agent Style Sheet이 조금씩 다르다

            1. 초기화 -> User Agent Style Sheet를 제거하고싶다
                - 브라우저 안에 박혀있어서 제거는 못함, 건들수가 없음
                a. 그냥 있는 그대로 쓰기 + 거기에 개발자가 추가로 서식을 구현하기
                b. Reset CSS + 추가 서식 구현 <- 비추천
                c. Normalize CSS + 추가 서식 구현, 브라우저 종류 통일 <- 비추천
            
            2. CSS 디자인 프레임워크를 사용할 것인가? -> 이게 뭐임?: 라이브러리
                a. Bootstrap
                b. Tailwind CSS
                c. PureCSS

            3. 템플릿 사용
                - 장점: 베이스 품질 높음
                - 단점: 수정이 어렵다
        
        
        
        */
    </style>
</head>
