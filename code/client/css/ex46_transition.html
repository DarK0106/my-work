<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션</title>
    <style>
        #box
        {
            background-color: gold;
            width: 150px; height: 150px;
        }
        body:hover #box
        {
            /* 
            transition 은 단순한 애니메이션,
            animation 은 복잡한 애니메이션
            
            
            
            */
            /* width: 300px; */
            /* 마우스가 올라가면 재생할 애니메이션을 정의 + 실행 */
            /* animation-name: key1; */
            /* animation-name: key2; */
            animation-name: none;
            animation-duration: 1s;
            animation-timing-function: linear;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;

        }
        @keyframes key1 
            {
                /* 애니메이션 시작 지점 */
                from
                {
                    width: 150px;
                }

                to
                {
                    width: 300px;
                }
            }

        @keyframes key2
            {
                0%
                {
                    width: 150px;
                }
                25%
                {
                    width: 500px;
                    
                }
                50%
                {
                    width: 150px;
                    
                }
                75%
                {
                    width: 500px;
                    
                }
                100%
                {
                    width: 150px;

                }
            }
        
        @keyframes key3
        {
            0%
            {
                transform: translate(0px, 0px);
            }
            25%
            {
                transform: translate(300px, 0px);
            }
            50%
            {
                transform: translate(300px, 500px);
            }
            75%
            {
                transform: translate(0px, 500px);
            }
            100%
            {
                transform: translate(0px, 0px);
            }
            
        }

        .effect:hover
        {
            animation-name: key-effect;
            animation-duration: .1s;
        }

        .effect2:hover
        {
            animation-name: key-effect2;
            animation-duration: .3s;
        }

        /* HTML, CSS -> 케밥 표기법을 많이 사용 */
        @keyframes key-effect 
        {
            0%
            {
                transform: translate(0px, 0px);
            }
            25%
            {
                transform: translate(-1px, 0px);
            }
            50%
            {
                transform: translate(0px, 0px);
            }
            75%
            {
                transform: translate(1px, 0px);
            }
            100%
            {
                transform: translate(0px, 0px);
            }
        }

        @keyframes key-effect2
        {
            0%
            {
                text-shadow: 0px 0px 0px black;
            }
            50%
            {
                text-shadow: 2px 2px 2px black;
                transform: translate(-2px, -2px);
            }
            100%
            {
                text-shadow: 0px 0px 0px black;
            }
            
        }


    </style>
    <script src="https://kit.fontawesome.com/02b63299de.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- ex46_transition.html  -->
    <h1>애니메이션</h1> 
    <div id="box">상자</div>

    <h1>버튼</h1>
    <button class="effect">구매하기</button>
    <button class="effect">판매하기</button>
    <button class="effect">찜하기</button>
    <hr>
    <button class="effect2">
        <span><i class="fa-solid fa-file-pen"></i></span>
        글쓰기
    </button>
    <button class="effect2">
        <span><i class="fa-regular fa-pen-to-square"></i></span>
        수정하기
    </button>
    <button class="effect2">
        <span><i class="fa-solid fa-delete-left"></i></span>
        삭제하기
    </button>
</body>
</html>
