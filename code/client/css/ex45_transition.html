<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가속도</title>
    <style>
        #list
        {
            border: 1px solid black;
            width: 1000px;
        }
        
        #list .box
        {
            width: 100px; height: 50px; margin: 15px 0px;
            transition-property: transform;
            transition-duration: 5s;
            transition-delay: 3s;
        }
        #box1
        {
            background-color: crimson;
            transition-timing-function: linear;
        }
        #box2
        {
            background-color: orange;
            transition-timing-function: ease;
        }
        #box3
        {
            background-color: gold;
            transition-timing-function: ease-in;
        }
        #box4
        {
            background-color: green;
            transition-timing-function: ease-out;
        }
        #box5
        {
            background-color: cornflowerblue;
            transition-timing-function: ease-in-out;
        }

        #list:hover .box
        {
            transform: translate(900px, 0px);
        }
    </style>
</head>
<body>
    <!-- ex45_transition.html  -->
    <h1>가속도</h1> 
    <!-- div#list>(box#box$.box*5) -->
    <div id="list">
        <div id="box1" class="box">linear</div>
        <div id="box2" class="box">ease(default)</div>
        <div id="box3" class="box">ease-in</div>
        <div id="box4" class="box">ease-out</div>
        <div id="box5" class="box">ease-in-out</div>
    </div>
</body>
</html>
