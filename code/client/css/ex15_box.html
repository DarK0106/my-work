<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            박스 모델
            1. 테두리, border
            2. 너비, 높이 -> px 아니면 %를 보편적으로 사용
            px는 절대값(부모가 바뀌어도 안바뀜), %는 상대값
                - width
                - height
        
        
        
        
        
        */

    #div2
    {
        background-color: gold;
        /* border: 1px solid black; */

        width: 50%; /* 기본값이 100% */
        width: 500px; /* 부모가 커지던말던 500px */

        /* 높이에 대한 상대값은 나중에 수업 */
        height: 500px;
    }




    </style>
</head>
<body>
    <!-- ex15_box.html -->
    <h1>박스 모델</h1>
    <!-- div#div$.box{상자$}*3 -->
    <div id="div1" class="box">상자1</div>
    <div id="div2" class="box">상자2</div>
    <div id="div3" class="box">상자3</div>

    <input type="text" class="txt"><br>
    <input type="text" class="txt"><br>
    <input type="text" class="txt"><br>
</body>
</html>
