    CSS 선택자

    4. 클래스 선택자
    5. 그룹 선택자
    6. 자식 선택자, Child Selector
    - 부모 선택자 > 자식 선택자 {}

    - 친부모를 조건으로 친자식을 선택한다.

    7. 자손 선택자, Descendant Selector 
    - 조상선택자 자식선택자 {}
    - 조상을 조건으로 자식을 선택한다.
