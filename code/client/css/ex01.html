<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        div { color : red; }

    </style>
    <link rel = "stylesheet" href = "ex02.css">
</head>
<body>
    <!-- html:5 치고 엔터 또는 ! 치고 엔터 -->
    <h1>CSS</h1>
    <div>안녕하세요.</div>

    <!--
    ex01.html

    HTML
    1. 출력 -> 골격 생성(블럭 태그)
    2. 출력 -> 내용물 생성(인라인 태그 -> 이미지, 링크, 텍스트)
    3. 출력 -> 서식 지정(크기, 색상, 여백 등) <- 절대 사용하면 안됨 !!

    왜? CSS가 담당할 예정, 이거 하려고 태어난 언어임

    CSS
    1. 기존 HTML 문서 -> 서식 지정

    CSS, Cascading Style Sheet
    - 스타일 언어
    - 기존 HTML 서식 작업(10%) + 확장 기능(90%)
    
    CSS 버전
    - CSS 1, CSS 2, CSS 3(+ HTML 5)

    CSS 장점
    - 서식 기능이 풍부하다
    - 생산성이 높다.(+ 유지 보수성도 좋음)
    - HTML 코드와 CSS 코드를 분리해서 작업(*중요)
    -->

    <!--
        요구사항) "안녕하세요." * 5 출력
        추가 요구사항) 글자색을 빨간색으로 바꿔달라
        추가 요구사항) 글자색을 파란색으로 바꿔달라

    
    -->

    <h1>요구사항</h1>

    <h2>HTML 사용</h2>
    <!--
    단축키: alt + shift + 방향키 = 복사붙여넣기 한방에
    ctrl + alt + 아래 방향키 = 열 편집, 빠져나오는건 esc
    alt + 클릭 = 수직 편집
    -->
    <p><font color = "blue">안녕하세요.</font></p>
    <p><font color = "blue">안녕하세요.</font></p>
    <p><font color = "blue">안녕하세요.</font></p>
    <p><font color = "blue">안녕하세요.</font></p>
    <p><font color = "blue">안녕하세요.</font></p>

    <h2>HTML + CSS 사용</h2>

    <div>안녕하세요.</div>
    <div>안녕하세요.</div>
    <div>안녕하세요.</div>
    <div>안녕하세요.</div>
    <div>안녕하세요.</div>

</body>
</html>
