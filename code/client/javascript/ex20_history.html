<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <style>

    </style>
</head>

<body>
    <!-- ex20_history.html  -->
    <h1>History</h1>
    <form action="" name="form1">
        <input type="button" value="버튼1" name="btn1">
        <input type="button" value="버튼2" name="btn2">
        <input type="button" value="버튼3" name="btn3">
    </form>
    <script>
        window.document.form1.btn1.onclick = m1;
        window.document.form1.btn2.onclick = m2;
        window.document.form1.btn3.onclick = m3;

        // http://127.0.0.1:5500/ex20_history.html
        // history 객체
        // - window의 자식
        // 브라우저의 히스토리 영역 -> 방문했던 URL을 기록
        // 브라우저가 가지고 있는 히스토리 영역에 접근해서 방문 기록 등을 열람할 수 있는 자바스크립트 객체
        function m1() {
            window.history.back();
        }
        function m2() {
            window.history.forward();
            
        }
        function m3() {
            window.history.go(-2); // 뒤로가기 2번
            
        }
    </script>

</body>

</html>
