<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript를 HTML 문서에 적용하는 방법</title>
    <style>
        /* CSS 영역 */
    </style>
    <script>

        // JavaScript 영역
        /*
        
        
        
        
        */
        alert('ㅎㅇㅎㅇ');


    </script>
    
    <!-- 자바스크립트는 <script>로 참조 -->
    <script src="/ex02.js"></script>
</head>
<body>
    <!-- ex02.html  -->
    <h1>JavaScript를 HTML 문서에 적용하는 방법</h1> 
    <!-- 
        1. 인라인 방식(안씀)
            - 이벤트 핸들러(Event Handler) == 이벤트
            - 이름이 무조건 on ~ 임(onXXX 속성 제공)
            - 태그에 직접 자바스크립트를 작성하는 방식

        2. 내부 방식
            - <script> 태그

        3. 외부 방식
            - *.js 파일
            - 참조
    
    
    -->
    <div><input type="button" value="버튼"
            style="color: cornflowerblue;"
            onclick="alert('안녕')">
    </div>

</body>
</html>
