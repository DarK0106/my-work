<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        form input {
            display: block;
            padding: 5px;
            margin: 5px;
        }
    </style>
</head>

<body>
    <!-- ex31_dom.html  -->
    <h1>DOM</h1>
    <form action="" name="form1">
        <input type="text" name="txt1" id="txt1" class="txts">
        <input type="text" name="txt2" id="txt2" class="txts">
        <input type="text" name="txt3" id="txt3" class="txts">
        <input type="button" value="버튼1" name="btn1" id="btn1">
    </form>

    <script>
        /*
            1. BOM, Browser Object Model
                - 트리 구조
                - 고정된 트리
                - 일부 태그만 조작 가능(form 관련, image, a)
                - 제공되는 기능 부족
                - DOM Level 0이라고 표현하는 사람도 있지만 공식적으로 존재하는 표현은 아님
                    <- 이렇게 부르는건 비추천

            2. DOM, Document Object Model
                - 시간이 흐르면서 BOM이 개발자들의 니즈를 충족하지 못해 만들어낸 확장판
                - 트리 구조
                - 문서 내용을 기반으로 하는 동적 트리
                    + 모든 태그 조작 가능
                - 제공되는 기능이 BOM에 비해서 월등하게 많아짐
                - 현재 웹을 만드는 일등공신 중 하나, 가장 중요한 자바스크립트 기능

            DOM
            - BOM은 name만 식별자로 사용 가능
            - DOM은 name, id, class 등 태그 식별 방식이 다양함
            - CSS 조작 가능
            - PCDATA 조작 가능
            - DOM Level 1 -> DOM Level 2 -> DOM Level 3

            BOM의 최상위 객체 -> window
            DOM의 최상위 객체 -> document

            태그 검색 도구(BOM)
            1. 트리 구조 기반 -> name으로 검색
            2. 내장 배열 -> name 또는 index로 검색

            태그 검색 도구(DOM)
            1. id로 검색 -> document.getElementById('id')
            2. class로 검색 -> document.getElementsByClassName('class')
            3. name으로 검색 -> document.getElementsByName('name')
            4. 태그명으로 검색 -> document.getElementsByTagName('tag')
            5. CSS 선택자로 검색
                - ES6에서 추가(2014년) -> 이전까지는 이런 베이스의 
                기술을 만들어놓은 라이브러리가 있었음(jQuery)
                - document.querySelector('CSS 선택자');
                - document.querySelectorAll('CSS 선택자');
        
        
        
        
        
        */

        document.form1['btn1'].onclick = function() {
            // <input type="text" name="txt1" id="txt1" class="txts">
            // 이걸 찾고싶다

            // BOM으로 찾기
            window.document.form1.txt1.value = 'BOM';

            // DOM(id)로 찾기
            // 찾는 방법이 다른거지 찾고 난 이후에는 똑같음
            document.getElementById('txt1').value = 'DOM';

            // BOM으로 찾은거랑 DOM(id)로 찾은게 동일한 객체냐고 물어보자
            console.log(document.form1.txt1 === document.getElementById('txt1'));

            // DOM(class)로 찾기
            var txts = document.getElementsByClassName('txts');
            console.log(txts); // 이녀석은 배열같이 생긴 무언가(유사 배열 객체)임

            for (var i=0; i<txts.length; i++) {
                txts[i].value = i;
            }

            // DOM(name)으로 찾기
            // 이렇게 찾았는데 텍스트박스 첫번째거를 찾은게 아니고 배열을 찾은거다?
            // document.getElementsByName('txt1');

            // 그래서 이렇게 써야하지만 이 방식을 많이 쓰진 않는다
            /// document.getElementsByName('txt1')[0].value = 'DOM(name)';

            // DOM(tag)로 찾기 <- 얘도 잘 안쓴다
            // 왜 잘 안쓸까? id랑 class로 찾아도 매우 충분하기 때문
            // var input = document.getElementsByTagName('input');

            // for (var i=0; i<input.length; i++) {
            //     input[i].value = i;
            // }

            // CSS 선택자로 찾기(한개를 찾을떄)
            document.querySelector('#txt1').value = 'CSS';
            document.querySelector('.txts:nth-child(2)').value = 'CSS2';

            // 여러개를 찾을때
            var list = document.querySelectorAll('.txts');

            for (var i=0; i<list.length; i++) {
                list[i].value = i;
            }

            // BOM or DOM -> 같은 객체(+타입) 반환
            console.log(document.form1.txt1 === document.querySelector('#txt1'));


        }

    </script>

</body>

</html>
