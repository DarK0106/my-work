    <script>
        /*
            자바스크립트에는 내장 배열이란게 있음(= 컬렉션)
            - 문서 내용(작성된 HTML)을 기반으로 자동으로 만드는 배열

            1. window.document.images
            2. window.document.links
            3. window.document.anchors
            4. window.document.forms
            5. window.document.forms[index].elements
            6. window.document.forms[index].select.options
            ----------------------------------------------
            7. window.document.all -> 비표준(MS가 인터넷 익스플로러에 쓰려고 만든것) 
        
        
        */

        console.log(window.document.images); // 현재 보고 있는 페이지에 있는 모든 이미지가 이 배열 안에 자동으로 담겨있다.

        for (var i = 0; i < window.document.images.length; i++) {
            console.log(window.document.images[i].src); // 이미지의 링크 확인 가능
        }

        console.log(window.document.links);

        console.log(window.document.anchors);
        
        console.log(window.document.forms);
        
        console.log(window.document.forms[0].elements);
        console.log(window.document.forms[1].elements);
        // form은 원래 한 페이지 당 하나만 쓰는데 혹시 폼 여러개 쓰는 페이지 관리하라고 만든 내장 배열

        // 페이지상에 있는 모든 태그를 가져오는 유사 배열 객체
        console.log(window.document.all);

        window.document.all.txt1.value = '아무개';


    </script>
