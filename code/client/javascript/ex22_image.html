<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지</title>
    <style>

    </style>
</head>

<body>
    <!-- ex22_image.html  -->
    <h1>이미지</h1>
    <input type="button" value="버튼1" name="btn1">

    <h1>이미지</h1>
    <img src="images/cat01.jpg" alt="" name="cat1">
    <hr>
    <img src="images/cat01.jpg" alt="" name="cat2">
    <hr>
    <img src="images/switch_on.png" alt="" name="sw1">
    <hr>

    <img src="images/rect_icon01.png" alt="" name="icon1">
    <hr>
    <img src="images/wall01.jpg" alt="" name="wallpaper1">
    <hr>

    <img src="images/0.png" alt="" name="number1">
    <hr>


    <script>
        // window.document.form1.btn1
        // 지금 폼이 없는 상황인데 btn1 어떻게찾음?
        // window.document.all.btn1

        // document.all.btn1 // 윈도우는 생략 가능
        // all이 배열이기때문에
        // 자바스크립트 배열의 요소 접근 방식
        // - list[0]
        // - list['name']
        // - list.name
        // 자바스크립트의 배열은 인덱스로도 찾을 수 있지만 name을 갖고 있다면
        // - document.all[8] <- 잘안씀
        // - document.all.btn1
        // - document.all['btn1']

        // 혹시라도 이름에 케밥표기법을 쓰면 문제 발생할 수 있음(이름에 - 기호 있는 경우)
        // - document.all['btn1'] <- 언제든지 안정적으로 사용 가능

        document.all['btn1'].onclick = m1;
        document.all['sw1'].onclick = m4;

        function m1() {
            // document.images[0]
            // document.images.cat1
            // document.images['cat1']

            // console.log(document.images['cat1']);
            // document.images['cat1'].width = 500;
            document.images['cat1'].src = 'images/cat02.jpg'; // 이미지 바꾸기

        }

        // 롤오버 이미지
        document.images['cat2'].onmouseover = m2;
        document.images['cat2'].onmouseout = m3;

        function m2() {
            document.images['cat2'].src = 'images/cat02.jpg';
        }
        function m3() {
            document.images['cat2'].src = 'images/cat01.jpg';
        }


        function m4() {
            // 토글 이미지 버튼
            if (document.images['sw1'].src.endsWith('switch_on.png')) {
                document.body.bgColor = 'black';
                document.images['sw1'].src = 'images/switch_off.png';

            } else {
                document.body.bgColor = 'white';
                document.images['sw1'].src = 'images/switch_on.png';

            }

        }


        var n = 1;

        document.images['icon1'].onclick = m5;
        function m5() {
            // alert();
            n++;

            if (n > 18) {
                // alert('마지막 아이콘입니다.');
                // return;
                n = 1; // loop
            }
            document.images['icon1'].src
                = 'images/rect_icon' + (n + '').padStart(2, '0') + '.png';
        }

        // m6 + m7
        var m = 1;

        window.onkeydown = function (event) {

            if (event.keyCode == 39) { // 오른쪽 방향키
                m++;
                if (m > 35) {
                    alert('마지막 이미지입니다.');
                    m--;
                } else {
                    document.images['wallpaper1'].src = 'images/wall' + (m + '').padStart(2, '0') + '.jpg';
                }
            } else if (event.keyCode == 37) { // 왼쪽 방향키
                m--;
                if (1 > m) {
                    alert('첫 이미지입니다.');
                    m++;
                } else {
                    document.images['wallpaper1'].src = 'images/wall' + (m + '').padStart(2, '0') + '.jpg';
                }
            }

            if (event.key >= 0 && event.key <= 9) {
                document.images['number1'].src = 'images/' + event.key + '.png';
            }
        };




    </script>

</body>

</html>
