<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box</title>
    <style>
        #box1 {
            width: 150px;
            height: 150px;
            background-color: gold;
            position: absolute;
        }
    </style>
</head>

<body>
    <!-- ex55_css.html  -->
    <h1>Drag & Drop <small>absolute</small></h1>
    <div id="box1"></div>
    <script>
        const box1 = document.getElementById('box1');
        let isDown = false;
        let offsetX;
        let offsetY;


        window.onmousedown = event => {
            // 움직일 대상을 클릭할 때에만 반응을 하도록
            if (event.target.id == 'box1') {
                isDown = true;

                //상자의 어느 부위를 눌렀는지?
                offsetX = event.offsetX;
                offsetY = event.offsetY;
            }
        };
        window.onmousemove = event => {
            if (isDown == true) {
                box1.style['left'] = event.clientX + 'px';
                box1.style['top'] = event.clientY + 'px';
            }
        };
        window.onmouseup = event => {
            isDown = false;
        };
    </script>

</body>

</html>
