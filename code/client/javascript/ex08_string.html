<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열</title>
    <style>
        
    </style>
</head>
<body>
    <!-- ex08_string.html  -->
    <h1>문자열</h1> 

    <script>
        
        // 문자열 길이
        // - txt.length -> 자바에선 필드라고 부름 -> 자바스크립트에선 프로퍼티라고 부름

        // 문자열 검색
        // - indexOf()
        // - lastIndexOf()

        // 대소문자 변환
        // - toUpperCase()
        // - toLowerCase()

        // 추출
        // - subString(시작위치, 끝위치) -> 자바
        // - substr(시작위치, 길이) -> SQL
        // - 자바스크립트에선 둘 다 있음
        // - charAt(index)

        var txt = '안녕하세요. 홍길동입니다.';
        console.log(txt.substring(3, 10)); // 3~9 까지 짤라와라, 자바스크립트도 0부터 시작함
        console.log(txt.substr(3, 5)); // 3~7

        // 치환
        // - replace
        // - 처음 만나는 요소만 치환(반복 X)
        // - 자바스크립트에서의 정규표현식 사용
        // - 자바에선 new Pattern()
        txt = '안녕 홍길동 잘가 홍길동';

        console.log(txt.replace('안녕', 'Hello'));
        console.log(txt.replace('홍길동', '아무개'));
        console.log(txt.replace(/홍길동/, '아무개')); // 정규표현식
        console.log(txt.replace(/홍길동/g, '아무개')); // g = global
        // console.log(txt.replace(/홍길동/i, '아무개'));
        // console.log(txt.replace(/홍길동/a, '아무개'));

        // 공백 제거
        // - trim
        // - trimLeft(), trimRight() -> ltrim(), rtrim()
        // - trimStart(), trimEnd() -> 표준함수

        // 분할
        // - split(',')

        // 패턴 검색
        // - startsWith()
        // - endsEnd()

        txt = '1';
        console.log(txt.padStart(3, '0')); // SQL에서의 lpad()
        console.log(txt.padEnd(3, '0')); // rpad()

        txt = '안녕';
        console.log(txt.repeat(3));
    
    </script>
    
</body>
</html>
