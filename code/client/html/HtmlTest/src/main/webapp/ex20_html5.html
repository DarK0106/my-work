		<hr>

		<!-- 
			시멘틱 태그
			- 기능보다 의미에 더 중점을 둔 태그
		
		 -->
		URL: <input type="url">

		<hr>

		자바 코드:
		<div>int a = 10; // Error Code if (a > 0) { print('양수'); }</div>


		<hr>

		<!-- 번역기가 <code> 태그는 번역을 하지 않는다. -->
		<code>int a = 10;</code>

		<hr>

		Email: <input type="email">

		<hr>

		<!-- 
			HTML 5 문법에서는 존재하지만 실행하는 브라우저 가 지원할 수도 있고 지원 안할수도 있다.
			안드로이드는 되는데 애플 사파리는 안되거나 그런 경우
			
			html5test.com
		
		 -->

		숫자: <input type="number" min="0" max="100" step="10">

		<hr>

		범위(숫자입력) 
		<input type="range"
			oninput="document.getElementById('rtxt').value = this.value;"
			min="20" max="2000" step="20"> <input type="text" id="rtxt">


		<hr>

		색상: <input type="color"
			onchange="document.getElementById('ctext').value = this.value; 
                 document.body.style.backgroundColor = this.value;">
		<input type="text" id="ctext">

		<hr>

		날짜/시간: <input type="date">
		<hr>
		<input type="month">
		<hr>
		<input type="week">
		<hr>
		<input type="time">
		<hr>
		<input type="datetime">
		<hr>
		<input type="datetime-local">
		<hr>
		
		진행률
		<br>
		<progress value = "0"></progress><br>
		<progress value = "0.5"></progress><br>
		<progress value = "1"></progress><br>
		
		<progress value = "50" max = "100"></progress><br>

		수치:

		<meter value = "0"></meter><br>

		<meter value="60" min="0" max="100" low="60" high="60" optimum="100"></meter> 60점<br>

		<meter value="59" min="0" max="100" low="60" high="60" optimum="100"></meter> 59점<br>
