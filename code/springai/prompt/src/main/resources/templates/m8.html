<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf</title>
    <link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
</head>
<body>
    <!-- m8.html -->
    <h1>Spring AI <small>List&lt;Entity&gt;</small></h1>
    
    <form method="POST" action="/m8">
    <table>
        <tr>
            <td style="width: 600px;"><textarea name="message" required class="full"></textarea></td>
            <td><button>질문하기</button></td>
        </tr>
    </table>
    </form>
    
    <hr>
    
    <table th:if="${result}">
        <tr>
            <th>간식</th>
            <th>칼로리</th>
        </tr>
        <tr th:each="food : ${result}">
            <td th:text="${food.name}"></td>
            <td th:text="${food.calorie}"></td>
        </tr>
    </table>
    
</body>
</html>
