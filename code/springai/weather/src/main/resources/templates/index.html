<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring AI</title>
    <link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
</head>
<body>
    <!-- index.html -->
    <h1>Spring AI <small>Tool Calling</small></h1>
    
    <div>
        <input type="text" id="message" name="message" class="full" autofocus
            placeholder="서울 날씨 알려줘 / 부산 지금 외출해도 괜찮아?">        
    </div>
    <hr>
    <div id="result" class="message"></div>
    
    <script>
        
        document.getElementById('message').onkeydown = async function() {
            
            if (event.key != 'Enter') return;
            
            const response = await fetch('/weather', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded; chatset=UTF-8'
                },
                body: new URLSearchParams({ //weather?message=질문
                    message: event.target.value
                })
            });
            
            if (response.ok) {
                
                const text = await response.text();
                document.getElementById('result').textContent = text;
                
                // 지금 서울인데 오늘 우산을 가지고 외출할까?                
            }
            
        };
        
    </script>
    
</body>
</html>
