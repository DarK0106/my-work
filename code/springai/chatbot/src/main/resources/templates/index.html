<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring AI</title>
    <link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
    <style>
        #list {
            border: 1px solid var(--control-border-color);
            width: auto;
            padding: 1rem;
            margin: 1rem;
            height: 500px;
            overflow: auto;
        }
        
        #list .line {
            border-bottom: 1px dotted #CCC;
        }
        
        #list .sender {
            font-weight: bold;
            margin: .3rem;
            margin-top: 1rem;
        }
        #list .sender.User {
            color: cornflowerblue;
        }
        #list .sender.Bot {
            color: tomato;
        }
        #list .sender.System {
            color: yellowgreen;
        }
        #list .content {     
            margin: .3rem;
            margin-bottom: 1rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <!-- index.html -->
    <h1>Spring AI <small>Chatbot</small></h1>
    
    <div class="message">호텔과 관련 질의 사항을 친절할 호텔 챗봇이 도와드립니다.</div>
    
    <div id="list"></div>
    
    <div>
        <input type="text" id="message" name="message" class="full" autofocus placeholder="">        
    </div>
    <hr>
    
    
    <script>
        
        document.getElementById('message').onkeydown = async function(event) {

            if (event.key != 'Enter') return;

            const message = event.target.value.trim();
            if (!message) return;

            appendMessage('User', message);
            event.target.value = '';
            event.target.focus();

            const response = await fetch('/chat?message=' + encodeURIComponent(message), {
                method: 'GET'
            });

            if (response.ok) {

                const reader = response.body.getReader();

                let botMessage = appendMessage('Bot', '');
                let content = botMessage.querySelector('.content');
                await processStream(reader, content);

            }

        };


        function appendMessage(sender, content) {

            const messageElement = document.createElement('div');
            messageElement.className = 'line';

            const senderDiv = document.createElement('div');
            senderDiv.className = 'sender ' + sender;
            senderDiv.textContent = sender + ':';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.textContent = content;

            messageElement.appendChild(senderDiv);
            messageElement.appendChild(contentDiv);

            list.appendChild(messageElement);
            list.scrollTop = list.scrollHeight;
            return messageElement;
        }

        async function processStream(reader, contentElement) {
            const decoder = new TextDecoder('utf-8');
            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    contentElement.textContent += decoder.decode(value, { stream: true });
                    list.scrollTop = list.scrollHeight;
                }
            } catch (error) {
                console.error('Error processing stream:', error);
                contentElement.textContent += '\n[Stream interrupted]';
            }
        }
        
    </script>
    
</body>
</html>
