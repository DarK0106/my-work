        // 상속
        class Car {

            constructor(name, color) {

                // 멤버 변수
                this.name = name;
                this.color = color;
            }
        }

        class SportCar extends Car {

            constructor(name, color, speed) {
                super(name, color);
                this.speed = speed;
            }
            cruise () {

                return `시속 ${this.speed}km로 풀악셀`;
