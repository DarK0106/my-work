<body>


    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        function m1() {

            // 자바스크립트 특성
            // 문장 종결자 (;) 선택
            // return { 이렇게 안쓰고
            // return
            // { 이렇게 써버리면
            // 자바스크립트는 return 에서
            // 문장이 끝난줄 앎
            // 그래서 자바스크립트가
            // 어 이거 빈 리턴문이네 하고
            // 개발자 모르게 알아서 ; 를 찍음
            // 결론적으로
            // return
            // {
            // 이게
            // return; 이 되어버려서 에러남
            return {

                name: '홍길동',
                age: 20


            };

        }

        function m2() {

            return;
        }

        function m3() {
            return (
                {
                    name: '엄준식',
                    age: 30

                }

            );

        }

        console.log(m1());
        console.log(m3());

    </script>
